[package]
name = "meow-division-items"
description = "Meow Division items: one NEP-245 multi-token contract for every item, trophy, kit and skin in the game"
version = "0.2.1"
edition = "2024"
resolver = "3"
rust-version = "1.95"
license = "MIT"
# NEP-330: cargo-near embeds this link; the `contract_source_metadata` view returns it.
repository = "https://github.com/Meow-Division/meow-division"

[lib]
crate-type = ["cdylib", "rlib"]

# Reproducible build (NEP-330): the same image and command give the same wasm hash on any machine.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
near-sandbox = "0.4.0"
near-api = "0.8"
cargo-near-build = "0.11.0"
tokio = { version = "1.12.0", features = ["full"] }
testresult = "0.4.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

# `cfg(near)` is set by near-sdk 5.27+ when building the contract.
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
