<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Запуск контракта</title>
<link rel="icon" href="data:,">
<!-- The items contract's mainnet launch (served by scripts/chain-launch.mjs on this PC; the steps are contract/mainnet/DEPLOY.md):
     the human approves one prompt in the wallet of meowdivision.near, the helper does the rest. Then the update to 0.2.0
     (wallets made in the game): two more prompts, update_contract and then set_wallets with a transfer. A team tool, Russian only. -->
<style>
  :root { --bg: #10151c; --card: #18202a; --line: #2a3442; --ink: #ece6d8; --muted: #9aa5b1; --ok: #7fc46a; --acc: #f08a3c; --bad: #e4675c; --you: #86b4e2; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 28px 16px 60px; display: flex; flex-direction: column; gap: 16px; }
  h1 { margin: 0; font-size: 28px; }
  .sub { margin: 4px 0 0; color: var(--muted); }
  .cost { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; color: var(--muted); }
  .cost b { color: var(--ink); }
  .step { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 4px 12px; }
  .step.now { border-color: var(--acc); }
  .n { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: #222c38; font-weight: 600; grid-row: span 3; }
  .step.done .n { background: var(--ok); color: #10151c; }
  .step.now .n { background: var(--acc); color: #10151c; }
  .t { font-weight: 600; font-size: 16.5px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .who { font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 999px; background: #222c38; color: var(--muted); }
  .who.you { background: #19293a; color: var(--you); }
  .d { color: var(--muted); font-size: 14px; }
  .d ul { margin: 4px 0 0; padding-left: 18px; }
  .act { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 9px 16px; cursor: pointer; background: var(--acc); color: #10151c; }
  button.ghost { background: #222c38; color: var(--ink); font-weight: 500; }
  button:disabled { opacity: 0.45; cursor: default; }
  .msg { font-size: 13.5px; }
  .msg.bad { color: var(--bad); }
  .msg.ok { color: var(--ok); }
  pre { margin: 6px 0 0; white-space: pre-wrap; word-break: break-word; font-size: 12px; color: var(--muted); background: #0c1015; border-radius: 8px; padding: 10px; max-height: 220px; overflow: auto; }
  .checks { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; font-size: 14px; margin-top: 4px; }
  .checks span:nth-child(even) { text-align: right; }
  .y { color: var(--ok); } .no { color: var(--bad); }
  h2 { margin: 18px 0 0; font-size: 20px; }
  code { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <div>
    <h1>Запуск контракта на mainnet</h1>
    <p class="sub">Вы один раз подписываете в кошельке meowdivision.near. Остальное делает помощник на этом ПК.</p>
  </div>
  <div class="cost" id="cost">Загружаю…</div>
  <div id="steps"></div>
</main>
<script type="module">
  import { NearConnector } from "https://esm.sh/@hot-labs/near-connect@0.12.0";

  const $ = (s) => document.querySelector(s);
  const esc = (v) => String(v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const TGAS = (n) => String(BigInt(n) * 10n ** 12n);
  let S = null, wallet = null, account = "", busy = "", note = {}, logs = {};

  const connector = new NearConnector({ network: "mainnet", features: { signAndSendTransactions: true } });
  connector.on("wallet:signIn", async (t) => {
    account = (t.accounts && t.accounts[0] && t.accounts[0].accountId) || "";
    try { wallet = await connector.wallet(); } catch (e) { wallet = null; }
    render();
  });
  connector.on("wallet:signOut", () => { wallet = null; account = ""; render(); });

  async function refresh() {
    const r = await fetch("/api/state");
    S = await r.json();
    if (S.error) { $("#cost").innerHTML = '<span class="no">' + esc(S.error) + "</span>"; return; }
    render();
  }
  const fmt = (y) => (Number(BigInt(y) / 10n ** 20n) / 1e4).toLocaleString("ru-RU");

  function stepHtml(i, title, who, desc, done, now, action) {
    return '<div class="step' + (done ? " done" : now ? " now" : "") + '"><div class="n">' + (done ? "✓" : i) + "</div>" +
      '<div class="t">' + title + '<span class="who' + (who === "you" ? " you" : "") + '">' + (who === "you" ? "подписываете вы" : "делает помощник") + "</span></div>" +
      '<div class="d">' + desc + "</div>" + (action ? '<div class="act">' + action + "</div>" : "") + "</div>";
  }
  const msg = (k) => (note[k] ? '<span class="msg ' + (note[k].ok ? "ok" : "bad") + '">' + esc(note[k].text) + "</span>" : "") + (logs[k] ? "<pre>" + esc(logs[k]) + "</pre>" : "");

  function render() {
    if (!S) return;
    const st = S.steps, A = S.accounts, D = S.detail, ready = S.ready.wasm && S.ready.args;
    const total = Number(BigInt(S.amounts.items) + BigInt(S.amounts.walt)) / 1e24;
    $("#cost").innerHTML = "Уйдёт <b>" + total.toLocaleString("ru-RU") + " NEAR</b> с meowdivision.near: " + fmt(S.amounts.items) + " на " + A.items + " и " + fmt(S.amounts.walt) +
      " на " + A.walt + ", газ меньше 0,01. Сейчас на meowdivision.near: <b>" + (S.balance === null ? "?" : S.balance.replace(".", ",")) + " NEAR</b>." +
      (ready || st.launch || (D.items && D.items.deployed) ? "" : '<br><span class="no">' + (S.ready.wasm ? "" : "Сборка контракта не совпадает с проверенной. ") + (S.ready.args ? "" : "Файлы аргументов устарели: node gen/chainargs.mjs.") + "</span>");
    const me = account === A.game;
    const first = !st.launch ? 2 : !st.server ? 3 : 4;
    let h = "";
    h += stepHtml(1, "Кошелёк", "you", account ? (me ? "Подключён " + esc(account) + "." : '<span class="no">Подключён ' + esc(account) + ", нужен " + A.game + ".</span>") : "Подключите кошелёк, в котором лежит " + A.game + ".", me, !me,
      me ? '<button class="ghost" data-do="out">Отключить</button>' : '<button data-do="connect">' + (account ? "Сменить кошелёк" : "Подключить кошелёк") + "</button>");
    h += stepHtml(2, "Запуск", "you", "Одна подпись, в кошельке две транзакции:<ul>" +
      "<li>" + A.items + ": создать, перевести " + fmt(S.amounts.items) + " NEAR, залить контракт (" + Math.round(S.ready.wasmSize / 1000) + " КБ, SHA-256 <code>" + esc(S.ready.sha.slice(0, 12)) + "…</code>), new, " + D.wantTokens + " предмет и " + D.wantRecipes + " рецептов, ключ сервера (только game_mint и game_burn)</li>" +
      "<li>" + A.walt + ": создать, перевести " + fmt(S.amounts.walt) + " NEAR, ключ сервера (только market_give)</li></ul>" +
      "Ключей с полным доступом нет. Код контракта потом меняет только meowdivision.near (метод update_contract).", st.launch, first === 2,
      st.launch ? "" : '<button data-do="launch"' + (me && ready && !busy ? "" : " disabled") + ">" + (busy === "launch" ? "Жду кошелёк…" : "Подписать") + "</button>" + msg("launch"));
    h += stepHtml(3, "Ключи на сервер", "helper", "Оба ключа сервера записываются в /etc/meow-division.env, сервис игры перезапускается. Ключи нигде не показываются.", st.server, first === 3,
      st.server ? msg("server") : (st.launch ? '<button data-do="server"' + (busy ? " disabled" : "") + ">" + (busy === "server" ? "Записываю…" : "Записать") + "</button>" : "") + msg("server"));
    const c = D.config || {};
    const row = (k, v, ok) => "<span>" + k + '</span><span class="' + (ok ? "y" : "no") + '">' + esc(v) + "</span>";
    h += stepHtml(4, "Проверка", "helper", '<div class="checks">' +
      row("Контракт", D.items && D.items.deployed ? "залит" : "—", !!(D.items && D.items.deployed)) +
      row("Предметы", D.tokens + " из " + D.wantTokens, D.tokens >= D.wantTokens) +
      row("Рецепты", D.recipes + " из " + D.wantRecipes, D.recipes >= D.wantRecipes) +
      row("Владелец", c.owner_id || "—", c.owner_id === A.game) +
      row("Подпись игры", c.game_signer_id || "—", c.game_signer_id === A.items) +
      row("Уолт", c.walt_id || "—", c.walt_id === A.walt) +
      row("Ключи " + A.items, D.items ? D.items.keys + ", полный доступ: " + D.items.full : "—", !!D.items && D.items.full === 0) +
      row("Баланс " + A.items, D.items ? D.items.balance + " NEAR" : "—", !!D.items) +
      row("Баланс " + A.walt, D.walt ? D.walt.balance + " NEAR" : "—", !!D.walt) +
      row("Ключи на сервере", st.server ? "есть" : "нет", st.server) + "</div>", first === 4, false,
      '<button class="ghost" data-do="refresh">Обновить</button>');
    // the update to 0.2.0: wallets made in the game (DEPLOY.md, "Update"); shown once the contract is on chain, even when
    // this PC no longer keeps the server keys of the launch (~/meow-keys)
    if (st.launch || (D.items && D.items.deployed && D.config)) {
      const U = S.update, W = U.wallets || {}, G = U.gameKey || {};
      const next = !st.update ? 5 : !st.wallets ? 6 : 7;
      h += '<h2>Обновление 0.2.0: кошельки в игре</h2>';
      h += stepHtml(5, "Новый код", "you", "Одна подпись: meowdivision.near вызывает update_contract на " + A.items + " (1 yoctoNEAR) с новой сборкой (" + Math.round(S.ready.wasmSize / 1000) + " КБ, SHA-256 <code>" + esc(S.ready.sha.slice(0, 12)) + "…</code>). " +
        "Контракт сам ставит код и вызывает migrate: предметы, рецепты и балансы остаются, ключ сервера получает ещё метод game_wallet (тот же ключ, лимит газа снова 1 NEAR). Если migrate не пройдёт, останется старый код." +
        (U.ready ? "" : '<br><span class="no">Сборка не та, что проверена: соберите её (build-wasm.sh) и нажмите «Обновить».</span>'), st.update, next === 5,
        st.update ? "" : '<button data-do="update"' + (me && U.ready && !busy ? "" : " disabled") + ">" + (busy === "update" ? "Жду кошелёк…" : "Подписать") + "</button>" + msg("update"));
      h += stepHtml(6, "Кошельки", "you", "Одна подпись, две транзакции:<ul>" +
        "<li>set_wallets: игра может создать " + U.set.wallets_left + " кошельков, каждому " + fmt(U.set.wallet_deposit) + " NEAR с баланса контракта (1 yoctoNEAR)</li>" +
        "<li>перевод " + fmt(U.fund) + " NEAR на " + A.items + ": на эти депозиты и газ</li></ul>", st.wallets, next === 6,
        st.wallets ? "" : '<button data-do="wallets"' + (me && st.update && !busy ? "" : " disabled") + ">" + (busy === "wallets" ? "Жду кошелёк…" : "Подписать") + "</button>" + msg("wallets"));
      h += stepHtml(7, "Проверка обновления", "helper", '<div class="checks">' +
        row("Версия", U.version || "—", U.version === "0.2.0") +
        row("Код = проверенная сборка", U.current ? "да" : "нет", U.current) +
        row("Ключ сервера", G.methods ? G.methods.join(", ") : "нет", !!G.methods && G.methods.includes("game_wallet")) +
        row("Можно создать кошельков", U.wallets ? String(W.wallets_left) : "—", W.wallets_left > 0) +
        row("Депозит кошелька", U.wallets ? fmt(W.wallet_deposit) + " NEAR" : "—", !!U.wallets) +
        row("Создано", U.wallets ? String(W.wallets_made) : "—", !!U.wallets) +
        row("Свободно на " + A.items, D.items ? D.items.free + " NEAR" : "—", !!D.items && +D.items.free >= 2) + "</div>", next === 7, false,
        '<button class="ghost" data-do="refresh">Обновить</button>');
    }
    $("#steps").innerHTML = h;
  }

  // the wallet's one prompt: both accounts, the contract and its set-up (the same gas as the sandbox test checks)
  const tx = (receiverId, actions) => ({ signerId: S.accounts.game, receiverId, actions });
  const fc = (methodName, args, tgas, deposit) => ({ type: "FunctionCall", params: { methodName, args, gas: TGAS(tgas), deposit } });
  const fcKey = (publicKey, receiverId, allowance, methodNames) => ({ type: "AddKey", params: { publicKey, accessKey: { permission: { receiverId, allowance, methodNames } } } });
  async function signLaunch() {
    const A = S.accounts, K = S.publicKeys, M = S.amounts, D = S.detail, list = [];
    if (D.items && !D.items.deployed) throw new Error(A.items + " уже есть, но без контракта: такой аккаунт этот запуск не чинит.");
    if (!D.items) {
      const get = async (p) => { const r = await fetch(p); if (!r.ok) throw new Error((await r.json()).error); return r; };
      const code = new Uint8Array(await (await get("/api/wasm")).arrayBuffer());
      const [init, tokens, recipes] = await Promise.all(["new", "register_tokens", "set_recipes"].map(async (k) => (await get("/api/args/" + k)).json()));
      list.push(tx(A.items, [
        { type: "CreateAccount" },
        { type: "Transfer", params: { deposit: M.items } },
        { type: "DeployContract", params: { code } },
        fc("new", init, 30, "0"),
        fc("register_tokens", tokens, 100, "1"),
        fc("set_recipes", recipes, 60, "1"),
        fcKey(K.game, A.items, M.allowGame, ["game_mint", "game_burn"]),
      ]));
    }
    if (!D.walt) list.push(tx(A.walt, [{ type: "CreateAccount" }, { type: "Transfer", params: { deposit: M.walt } }, fcKey(K.waltfc, A.items, M.allowWalt, ["market_give"])]));
    if (!list.length) throw new Error("Всё уже на блокчейне: нажмите «Обновить».");
    await wallet.signAndSendTransactions({ transactions: list });
  }
  // the update: the new code as update_contract's base64 argument (the contract checks the owner and the yoctoNEAR)
  const b64 = (bytes) => { let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); };
  async function signUpdate() {
    const r = await fetch("/api/wasm");
    if (!r.ok) throw new Error((await r.json()).error);
    const code = new Uint8Array(await r.arrayBuffer());
    await wallet.signAndSendTransactions({ transactions: [tx(S.accounts.items, [fc("update_contract", { code: b64(code) }, 300, "1")])] });
  }
  async function signWallets() {
    const set = await (await fetch("/api/args/set_wallets")).json();
    await wallet.signAndSendTransactions({ transactions: [
      tx(S.accounts.items, [fc("set_wallets", set, 30, "1")]),
      tx(S.accounts.items, [{ type: "Transfer", params: { deposit: S.update.fund } }]),
    ] });
  }
  async function serverKeys() {
    const r = await fetch("/api/server", { method: "POST" });
    const j = await r.json();
    logs.server = (j.log || []).join("\n") || j.error || "";
    if (!r.ok) throw new Error(j.error || "ошибка помощника");
  }
  const FLOW = { launch: signLaunch, server: serverKeys, update: signUpdate, wallets: signWallets };

  async function step(k) {
    busy = k; note[k] = null; render();
    try {
      await FLOW[k]();
      note[k] = { ok: true, text: "Готово." };
      await refresh();
      if (k === "launch") { busy = ""; return await step("server"); }
    } catch (e) {
      note[k] = { ok: false, text: String((e && e.message) || e) };
      await refresh().catch(() => {});
    } finally {
      if (busy === k) busy = "";
      render();
    }
  }

  document.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-do]");
    if (!b) return;
    const k = b.dataset.do;
    if (k === "connect") { try { await connector.connect(); } catch (err) { note.launch = { ok: false, text: String((err && err.message) || err) }; render(); } return; }
    if (k === "out") { try { await connector.disconnect(); } catch (err) { /* already out */ } wallet = null; account = ""; render(); return; }
    if (k === "refresh") { refresh(); return; }
    step(k);
  });

  (async () => {
    try { wallet = await connector.wallet(); const acc = await wallet.getAccounts(); account = (acc[0] && acc[0].accountId) || ""; } catch (e) { wallet = null; }
    await refresh();
  })();
</script>
</body>
</html>
