[package]
name = "mock-registrar"
description = "A stand-in for mainnet's `near` registrar in the items contract's sandbox tests (near-linkdrop's create_account)"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false
repository = "https://github.com/Meow-Division/meow-division"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
